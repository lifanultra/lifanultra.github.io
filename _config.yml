# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 李凡的博客
subtitle: ''
description: ''
keywords:
author: Li Fan
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://lifanultra.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: LIFANULTRA

# LIFANULTRA 主题设置
# 这里写的每一项都会覆盖 themes/LIFANULTRA/_config.yml 里的同名项（同名项整体覆盖，不是逐行合并）
theme_config:
  # 配色：blackgreen 黑底绿字（自定义，见 themes/LIFANULTRA/source/css/_colors/blackgreen.styl）
  # 其他可选：dark 蓝黑 / light 灰底 / white 白底 / classic
  colorscheme: blackgreen

  # 页面最大宽度（rem）
  page_width: 48

  # 顶部导航菜单。键名决定显示文字，取自 themes/LIFANULTRA/languages/zh-CN.yml
  # 可用：home 首页 / about 关于 / articles 归档 / tag 标签 / category 分类 / search 搜索
  nav:
    home: /
    about: /about/
    articles: /archives/
    tag: /tags/

  # 首页显示的最近文章数量
  posts_overview:
    show_all_posts: false
    post_count: 10
    sort_updated: false

  # 首页不显示标签云
  tags_overview: false

  # 建站时间（北京时间），用于页脚实时计算存在时长
  site_since: '2015-12-12T00:00:00+08:00'

  # 版权年份
  copyright:
    start_year: 2015
    end_year: 2026

  # 404 页面文案
  error_404:
    enabled: true
    title: "404 页面不存在"
    description: "你访问的页面可能已被删除、改名，或暂时无法访问。"

  # 开启数学公式（从 cdnjs 加载 MathJax，正文里用 $...$ 或 $$...$$ 写公式）
  mathjax:
    enabled: true

  # 社交图标。默认值指向主题作者，已置空。
  # 要加自己的账号时，把下面注释打开并按格式写，icon 用 Font Awesome 图标名
  social_links: false
  # social_links:
  #   - icon: github
  #     link: https://github.com/你的用户名
  #   - icon: mail
  #     link: mailto:i@lifan.uno

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/lifanultra/lifanultra.github.io.git
  branch: gh-pages
  name: LIFANULTRA
  email: i@lifan.uno
